<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Scan Image — WatermarkWatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/global.css"/>
  <style>
    .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .sidebar {
      background: var(--bg2); border-right: 1px solid var(--border);
      padding: 24px 16px; display: flex; flex-direction: column; gap: 4px;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .sidebar-logo { display: flex; align-items: center; gap: 8px; padding: 4px 8px 20px; }
    .sidebar-logo span { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-radius: var(--radius); font-size: 13px; color: var(--text2);
      cursor: pointer; transition: all 0.15s; border: none; background: none; width: 100%; text-align: left;
      text-decoration: none;
    }
    .nav-item:hover { background: var(--bg3); color: var(--text); }
    .nav-item.active { background: var(--adim); color: var(--accent); }
    .sidebar-bottom { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
    .user-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius); background: var(--bg3); }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--adim); border: 1px solid rgba(0,229,160,0.2); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-name  { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-plan  { font-size: 11px; color: var(--text3); }
    /* Main */
    .main { padding: 32px 36px; }
    .page-title { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
    .page-sub   { font-size: 14px; color: var(--text2); margin-bottom: 28px; }
    /* Detector layout */
    .detector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    /* Upload */
    .upload-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .upload-zone {
      border: 1.5px dashed var(--border2); border-radius: var(--radius); min-height: 180px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
    }
    .upload-zone:hover, .upload-zone.drag-over { border-color: var(--accent); background: var(--adim2); }
    .upload-inner { text-align: center; padding: 28px 20px; }
    .upload-icon-wrap {
      width: 48px; height: 48px; border-radius: var(--radius); background: var(--bg3);
      border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px; color: var(--text2);
    }
    .upload-inner h3 { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .upload-inner p  { font-size: 12px; color: var(--text3); margin-bottom: 14px; }
    .url-row { display: flex; gap: 8px; }
    .url-input {
      flex: 1; background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
      padding: 10px 14px; border-radius: var(--radius); outline: none; transition: border-color 0.2s;
    }
    .url-input::placeholder { color: var(--text3); }
    .url-input:focus { border-color: var(--accent); }
    .preview-box {
      border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border);
      min-height: 140px; background: var(--bg4); position: relative;
    }
    .preview-box img { width: 100%; display: block; max-height: 240px; object-fit: contain; background: var(--bg4); }
    .scan-line {
      position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
      animation: scanMove 1.8s ease-in-out infinite; top: 0;
      box-shadow: 0 0 10px var(--accent);
    }
    @keyframes scanMove { 0%,100%{top:0%} 50%{top:96%} }
    .wmark-box { position: absolute; border: 2px solid var(--red); border-radius: 4px; box-shadow: 0 0 8px rgba(255,77,77,0.4); pointer-events: none; }
    /* Results */
    .results-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .results-head { display: flex; align-items: center; justify-content: space-between; }
    .results-title { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .empty-result { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text3); text-align: center; padding: 40px 20px; }
    .result-rows { display: flex; flex-direction: column; }
    .result-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .result-row:last-child { border-bottom: none; }
    .row-key { font-size: 12px; color: var(--text3); }
    .row-val { font-size: 13px; font-weight: 500; }
    .rv-found { color: var(--red); }
    .rv-clean { color: var(--accent); }
    .rv-warn  { color: var(--amber); }
    .conf-row { margin-top: 4px; }
    .conf-label-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text3); margin-bottom: 8px; }
    .conf-bar { height: 4px; background: var(--bg4); border-radius: 2px; overflow: hidden; }
    .conf-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.6s; }
    .verdict-box { padding: 14px; border-radius: var(--radius); font-size: 13px; line-height: 1.6; }
    .verdict-found { background: var(--rdim);  border: 1px solid rgba(255,77,77,0.2);  color: #ff9090; }
    .verdict-clean { background: var(--adim);  border: 1px solid rgba(0,229,160,0.2);  color: #80ffcc; }
    .verdict-warn  { background: var(--adim3); border: 1px solid rgba(245,166,35,0.2); color: #ffd080; }
    .detail-note { font-size: 12px; color: var(--text3); line-height: 1.7; }
    .quota-bar-wrap { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .quota-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text3); margin-bottom: 8px; }
    .quota-bar { height: 3px; background: var(--bg4); border-radius: 2px; overflow: hidden; }
    .quota-fill { height: 100%; background: var(--accent); border-radius: 2px; }
  </style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><svg width="14" height="14" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" stroke="#00E5A0" stroke-width="1.5"/><path d="M5 9l3 3 5-5" stroke="#00E5A0" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      <span>WatermarkWatch</span>
    </div>
    <a href="dashboard.html" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
      Dashboard
    </a>
    <a href="detector.html" class="nav-item active">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="7.5" r="2" stroke="currentColor" stroke-width="1.3"/><path d="M7.5 1.5v2M7.5 11.5v2M1.5 7.5h2M11.5 7.5h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      Scan Image
    </a>
    <a href="account.html" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 13c0-3.038 2.462-5.5 5.5-5.5S13 9.962 13 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      Account
    </a>
    <div class="sidebar-bottom">
      <div class="user-card">
        <div class="user-avatar" id="sideAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="sideUsername">Loading...</div>
          <div class="user-plan" id="sidePlan">free plan</div>
        </div>
      </div>
      <button class="nav-item mt-1" style="color:var(--text3)" onclick="logout()">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M5 13H2a1 1 0 01-1-1V3a1 1 0 011-1h3M10 10l3-3-3-3M14 7.5H6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="page-title">Scan Image</div>
    <p class="page-sub">Upload a sports image to detect watermarks and agency marks</p>

    <div class="detector-grid">

      <!-- Upload column -->
      <div class="upload-card">
        <div class="upload-zone" id="uploadZone">
          <div class="upload-inner">
            <div class="upload-icon-wrap">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M12 4v12M6 10l6-6 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M3 18v1a2 2 0 002 2h14a2 2 0 002-2v-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <h3>Drop sports image here</h3>
            <p>JPG, PNG, WebP · Up to 20MB</p>
            <label class="btn btn-ghost btn-sm" for="fileInput" style="cursor:pointer">Choose file</label>
            <input type="file" id="fileInput" accept="image/*" hidden/>
          </div>
        </div>

        <div class="url-row">
          <input class="url-input" type="text" id="urlInput" placeholder="Or paste image URL…"/>
          <button class="btn btn-primary" id="scanBtn" onclick="doScan()">
            <span id="scanLabel">Scan</span>
            <svg id="scanSpin" class="spin hidden" width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="7" r="5.5" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
              <path d="M7 1.5A5.5 5.5 0 0112.5 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div id="previewWrap" class="hidden">
          <div class="preview-box" id="previewBox">
            <img id="previewImg" src="" alt="Preview"/>
            <div id="scanLine" class="scan-line hidden"></div>
            <div id="wmarkBox" class="wmark-box hidden"></div>
          </div>
        </div>

        <!-- Quota -->
        <div class="quota-bar-wrap">
          <div class="quota-label">
            <span>Monthly quota</span>
            <span id="quotaLabel">—</span>
          </div>
          <div class="quota-bar"><div class="quota-fill" id="quotaFill" style="width:0%"></div></div>
        </div>
      </div>

      <!-- Results column -->
      <div class="results-card">
        <div class="results-head">
          <span class="results-title">Analysis Result</span>
          <span class="badge badge-neutral" id="statusBadge">Awaiting image</span>
        </div>

        <div class="empty-result" id="emptyResult">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" opacity=".3">
            <circle cx="18" cy="18" r="14" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3"/>
            <path d="M12 18h12M18 12v12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          <p style="font-size:13px">Upload an image to begin detection</p>
        </div>

        <div id="resultData" class="hidden" style="display:flex;flex-direction:column;gap:14px">
          <div class="result-rows" id="resultRows"></div>
          <div class="conf-row">
            <div class="conf-label-row"><span>Confidence</span><span id="confPct">—</span></div>
            <div class="conf-bar"><div class="conf-fill" id="confFill" style="width:0%"></div></div>
          </div>
          <div class="verdict-box" id="verdictBox"></div>
          <p class="detail-note" id="detailNote"></p>
        </div>

        <div id="errorResult" class="hidden">
          <p style="color:var(--red);font-size:13px" id="errorMsg"></p>
        </div>
      </div>

    </div>
  </main>
</div>

<div id="toast"></div>
<script src="../src/utils.js"></script>
<script>
  if (!Auth.requireAuth()) throw new Error('redirect');

  let selectedFile = null;

  // Init sidebar
  const user = Auth.getUser();
  if (user) {
    document.getElementById('sideAvatar').textContent   = user.username[0].toUpperCase();
    document.getElementById('sideUsername').textContent = user.username;
    document.getElementById('sidePlan').textContent     = user.plan + ' plan';
    updateQuota(user.scans_used, user.scans_limit);
  }

  function updateQuota(used, limit) {
    const pct = limit > 0 ? Math.round(used / limit * 100) : 0;
    document.getElementById('quotaLabel').textContent = `${used} / ${limit} used`;
    document.getElementById('quotaFill').style.width = pct + '%';
    if (pct >= 100) document.getElementById('quotaFill').style.background = 'var(--red)';
  }

  // Drag & drop
  const zone = document.getElementById('uploadZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); const f = e.dataTransfer.files[0]; if (f?.type.startsWith('image/')) loadFile(f); });
  zone.addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

  function loadFile(file) {
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = e => { showPreview(e.target.result); resetResult(); };
    reader.readAsDataURL(file);
  }

  function showPreview(src) {
    document.getElementById('previewImg').src = src;
    document.getElementById('previewWrap').classList.remove('hidden');
    document.getElementById('wmarkBox').classList.add('hidden');
    document.getElementById('scanLine').classList.add('hidden');
  }

  document.getElementById('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') doScan(); });

  async function doScan() {
    const urlVal = document.getElementById('urlInput').value.trim();
    if (!selectedFile && !urlVal) { toast('Upload an image or paste a URL', 'error'); return; }

    const btn   = document.getElementById('scanBtn');
    const label = document.getElementById('scanLabel');
    const spin  = document.getElementById('scanSpin');

    btn.disabled = true; label.textContent = 'Scanning…'; spin.classList.remove('hidden');
    document.getElementById('scanLine').classList.remove('hidden');
    resetResult();

    // Show preview for URL
    if (!selectedFile && urlVal) {
      const img = document.getElementById('previewImg');
      img.src = urlVal;
      document.getElementById('previewWrap').classList.remove('hidden');
    }

    try {
      let data;
      if (selectedFile) {
        const form = new FormData();
        form.append('image', selectedFile);
        data = await apiFetch('/api/detect', { method: 'POST', body: form });
      } else {
        data = await apiFetch('/api/detect', { method: 'POST', body: JSON.stringify({ image_url: urlVal }) });
      }
      showResult(data);
      // Update quota
      if (data.scans_remaining !== undefined) {
        const u = Auth.getUser();
        if (u) { u.scans_used = u.scans_limit - data.scans_remaining; Auth.setSession(Auth.getToken(), u); updateQuota(u.scans_used, u.scans_limit); }
      }
    } catch(err) {
      document.getElementById('errorMsg').textContent = err.message;
      document.getElementById('errorResult').classList.remove('hidden');
      document.getElementById('emptyResult').classList.add('hidden');
    } finally {
      btn.disabled = false; label.textContent = 'Scan'; spin.classList.add('hidden');
      document.getElementById('scanLine').classList.add('hidden');
    }
  }

  function showResult(d) {
    document.getElementById('emptyResult').classList.add('hidden');
    document.getElementById('errorResult').classList.add('hidden');
    document.getElementById('resultData').classList.remove('hidden');
    document.getElementById('resultData').style.display = 'flex';

    // Badge
    const badge = document.getElementById('statusBadge');
    if (d.watermark_found)       { badge.className='badge badge-found'; badge.textContent='Watermark found'; }
    else if (d.possibly_removed) { badge.className='badge badge-warn';  badge.textContent='Possibly removed'; }
    else                         { badge.className='badge badge-clean'; badge.textContent='No watermark'; }

    // Rows
    const rows = [
      ['Watermark found', d.watermark_found ? 'Yes' : 'No', d.watermark_found ? 'rv-found' : 'rv-clean'],
      ['Agency', d.agency || '—', ''],
      ['Type', d.type || '—', ''],
      ['Location', d.location || '—', ''],
      ['Unauthorized use', d.unauthorized ? 'Likely yes' : 'Unlikely', d.unauthorized ? 'rv-found' : 'rv-clean'],
    ];
    document.getElementById('resultRows').innerHTML = rows.map(([k,v,c]) =>
      `<div class="result-row"><span class="row-key">${k}</span><span class="row-val ${c}">${v}</span></div>`
    ).join('');

    // Confidence
    const pct = Math.round((d.confidence || 0) * 100);
    document.getElementById('confFill').style.width = pct + '%';
    document.getElementById('confPct').textContent  = pct + '%';

    // Verdict
    const vb = document.getElementById('verdictBox');
    vb.className = 'verdict-box ' + (d.watermark_found ? 'verdict-found' : d.possibly_removed ? 'verdict-warn' : 'verdict-clean');
    vb.textContent = d.verdict || '';

    document.getElementById('detailNote').textContent = d.notes || '';

    // Highlight region
    if (d.region && selectedFile) {
      const r = d.region;
      const box = document.getElementById('wmarkBox');
      box.style.top = r.top+'%'; box.style.left = r.left+'%';
      box.style.width = r.width+'%'; box.style.height = r.height+'%';
      box.classList.remove('hidden');
    }
  }

  function resetResult() {
    document.getElementById('emptyResult').classList.remove('hidden');
    document.getElementById('resultData').classList.add('hidden');
    document.getElementById('resultData').style.display = 'none';
    document.getElementById('errorResult').classList.add('hidden');
    document.getElementById('statusBadge').className = 'badge badge-neutral';
    document.getElementById('statusBadge').textContent = 'Awaiting image';
  }
</script>
</body>
</html>
